<h1>{{ portalName }}</h1>

<p>
  Welcome back! Browse your courses, track grades,
  and manage enrollment all in one place.
</p>

<div class="stats">
  <span>Courses Available: 12</span>
  <span>Enrolled: 3</span>
  <span>GPA: 3.8</span>
</div>

<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<p *ngIf="message">
  {{ message }}
</p>

<input
  [(ngModel)]="searchTerm"
  placeholder="Search courses..." />

<p>
  Searching for: {{ searchTerm }}
</p>
