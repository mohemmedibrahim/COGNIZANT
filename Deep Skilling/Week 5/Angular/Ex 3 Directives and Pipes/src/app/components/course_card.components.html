<div
  class="card"
  [ngClass]="cardClasses"
  [ngStyle]="{ 'border-left-color': borderColor }"
  appHighlight="lightyellow"
>
  <h3>{{ course.name }}</h3>

  <p>Code: {{ course.code }}</p>

  <p>Credits: {{ course.credits | creditLabel }}</p>

  <span [ngSwitch]="course.gradeStatus" class="badge">

    <span *ngSwitchCase="'passed'" class="badge badge--passed">
      Passed
    </span>

    <span *ngSwitchCase="'failed'" class="badge badge--failed">
      Failed
    </span>

    <span *ngSwitchDefault class="badge badge--pending">
      Pending
    </span>

  </span>

  <div class="actions">
    <button (click)="onEnroll()">Enroll</button>
    <button (click)="toggleExpand()">Show Details</button>
  </div>

  <div class="details" *ngIf="isExpanded">
    <p>Course ID: {{ course.id }}</p>
  </div>
</div>
